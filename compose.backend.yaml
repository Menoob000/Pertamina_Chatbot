services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pertamina-backend
    env_file:
      - .env
    environment:
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
      PGVECTOR_HOST: host.docker.internal
      PGVECTOR_PORT: ${PGVECTOR_PORT:-15433}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./output:/app/output
      - ./data:/app/data:ro
    restart: unless-stopped
