# Build image backend FastAPI dan push ke GitHub Container Registry (ghcr.io).
# Image dipakai Azure Container Apps (lihat scripts/deploy_azure.py --image).
# Secret aplikasi TIDAK masuk image; disuntikkan Azure sebagai env saat runtime.
name: Build backend image

on:
  push:
    branches: [deploy-azure]
    paths-ignore:
      - "Frontend/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Kosongkan disk runner (image torch + docling + LibreOffice besar)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Nama image (ghcr wajib huruf kecil)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pertamina-backend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/hf-space/Dockerfile
          push: true
          build-args: |
            EMBEDDING_MODEL=sentence-transformers/all-minilm-l6-v2
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ringkasan
        run: |
          echo "Image: ${IMAGE}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
